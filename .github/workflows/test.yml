name: test

on:
  push:
    branches: [main]
  pull_request:
  # The bundle links against jbrowse-components `main`, which moves
  # independently of this repo, and the built bundle is committed so nothing
  # else ever rebuilds it. A break here is normally caused by a commit *there*,
  # which fires no event here — so the nightly run is the one that finds it. A
  # mobx major went undetected this way for two weeks.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the floor from pyproject's requires-python, and current
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # no network in these: they cover the config builders and the
      # Python <-> JS trait contract the bundle depends on
      - run: pytest -q

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - run: ruff check
      - run: ruff format --check

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # npx rather than `pnpm install`, which can't resolve the link: dependency
      # on the sibling jbrowse-components checkout that isn't present here
      - run: npx prettier@3 --check .

  # Shared setup for the two jobs that need the real dependency tree: the
  # `link:` deps resolve to a sibling jbrowse-components checkout, so CI checks
  # it out alongside and installs there first (the linked packages resolve
  # react/mobx from that tree, and `resolve.dedupe` makes this repo's copies of
  # those win — which is why the versions here have to track the monorepo's).
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: jbrowse-anywidget
      - uses: actions/checkout@v4
        with:
          repository: GMOD/jbrowse-components
          path: jbrowse-components
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile=false
        working-directory: jbrowse-components
      - run: pnpm install --frozen-lockfile=false
        working-directory: jbrowse-anywidget
      - run: pnpm build
        working-directory: jbrowse-anywidget

      # The bundle ships with no Node polyfills: it has no Buffer, and every
      # `process` read sits behind a `typeof process` guard, so only NODE_ENV
      # needs substituting. Both halves are worth asserting — a dependency that
      # starts reaching for Buffer, or a vite config change that drops the
      # `define`, would otherwise surface only as a blank widget in a notebook.
      - name: no unpolyfilled Node globals in the bundle
        working-directory: jbrowse-anywidget/jbrowse_anywidget/static
        run: |
          fail=0
          for f in index.js app.js; do
            # word boundary: ArrayBuffer.isView and any fooBuffer.bar are fine
            if grep -qE '(^|[^A-Za-z0-9_$])Buffer\.' "$f"; then
              echo "::error file=$f::Buffer is used but not polyfilled"
              fail=1
            fi
            if grep -q 'process\.env\.NODE_ENV' "$f"; then
              echo "::error file=$f::process.env.NODE_ENV was not substituted (vite define missing?)"
              fail=1
            fi
          done
          exit $fail

  # Separate from `bundle` because it catches a different class of break:
  # esbuild does not typecheck, so `pnpm build` passing proves nothing about
  # types and a missing import ships happily and fails at runtime.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: jbrowse-anywidget
      - uses: actions/checkout@v4
        with:
          repository: GMOD/jbrowse-components
          path: jbrowse-components
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile=false
        working-directory: jbrowse-components
      - run: pnpm install --frozen-lockfile=false
        working-directory: jbrowse-anywidget
      # tsc follows the linked packages into that checkout's TypeScript source,
      # so this typechecks against the monorepo as it actually is today
      - run: pnpm typecheck
        working-directory: jbrowse-anywidget

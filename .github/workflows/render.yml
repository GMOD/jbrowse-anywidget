# Run the example notebooks and render what they built, nightly.
#
# `bundle` proves the JavaScript builds and `typecheck` proves it type-checks;
# neither proves a notebook *runs* or that the widget *draws*. This does both:
# every examples/*.ipynb executes top-to-bottom in a real kernel, the widgets
# each one produced are read off that kernel, and those are rendered headless.
# It fails if a cell raises or if a figure never paints a canvas.
#
# Executing them is the only check they run at all -- pytest never opens one, so
# a cell that raises is invisible until a reader hits it in Colab.
#
# It is also the only thing that exercises the local-file read path end to end.
# jsdom cannot: its Blob.slice() returns an object with no arrayBuffer(), so
# generic-filehandle2 can't read from it. Notebook 12 writes a tabix BED of
# every human exon and a bigWig, and hands both over with add_local_file -- the
# bigWig is the strong one, since it can only render if the blob is genuinely
# random-access.
#
# Nightly rather than on push/PR, deliberately: it needs real network to
# jbrowse.org and UCSC, and it links against jbrowse-components `main`, so it
# fails for reasons that have nothing to do with the commit that triggered it.
# A flaky required check gets ignored, and then it is worth nothing. Run it by
# hand from the Actions tab when a config change needs proving.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

name: render

jobs:
  render:
    name: the notebooks run and the bundles draw
    runs-on: ubuntu-latest
    # a nightly with no timeout inherits GitHub's 6-hour default, so anything
    # that hangs burns a runner all night, every night. Well clear of the ~10
    # minutes this takes when it is behaving.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: jbrowse-anywidget
      # the `link:` deps and puppeteer both resolve from this checkout; the
      # harness also imports its readiness waits from the monorepo's
      # browser-test-utils, so a capture uses the same signals as jbrowse-web's
      # own browser tests rather than a bespoke sleep
      - uses: actions/checkout@v4
        with:
          repository: GMOD/jbrowse-components
          path: jbrowse-components
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      # node 24 strips TypeScript natively, which the harness needs: it imports
      # browser-test-utils' waits.ts directly, as source
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile=false
        working-directory: jbrowse-components
      - run: pnpm install --frozen-lockfile=false
        working-directory: jbrowse-anywidget
      # render what the source builds today, not the committed bundle: the
      # break this job exists to find normally comes from the monorepo
      - run: pnpm build
        working-directory: jbrowse-anywidget

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # `scripts` is the extra on top of dev: nbclient to run the notebooks, and
      # everything the notebooks themselves import. Kept out of dev so the
      # pytest jobs install none of it.
      - run: pip install -e ".[dev,scripts]"
        working-directory: jbrowse-anywidget

      # One command: execute every notebook, read the widgets off their kernels,
      # render each one. The specs it writes are gitignored -- they are what the
      # notebooks produced on this run, not a committed description of them.
      - name: run the notebooks and render what they built
        working-directory: jbrowse-anywidget
        env:
          PUPPETEER_FROM:
            ${{ github.workspace }}/jbrowse-components/package.json
        run: python scripts/run_examples.py

      # The screenshots prove every example still draws; this proves the two
      # runtime properties a drawn figure does not — that a tracks change
      # updates the live browser instead of rebuilding it, and that the RPC is
      # a worker rather than the notebook's UI thread. Same requirements as the
      # step above — a real browser, the built bundle, network — and
      # `if: always()` so a figure that fails to draw does not also hide them.
      - name: verify the bundle's runtime behaviour
        if: always()
        working-directory: jbrowse-anywidget
        env:
          PUPPETEER_FROM:
            ${{ github.workspace }}/jbrowse-components/package.json
        run: node scripts/verify_bundle_runtime.mjs

      # The images are the evidence, so they are worth keeping whichever way it
      # went — on success to eyeball, on failure to see how far it got. They are
      # NOT committed: re-rendering produces byte-different PNGs even with no
      # code change, so committing them would be pure churn.
      - name: upload the images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: jbrowse-anywidget/images/*.png
          if-no-files-found: error
